<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cacao Admin & Fulfillment</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CACAO CORNER</a><nav><a href="index.html">หน้าร้าน</a></nav></header><main class="section"><div class="section-heading"><p class="eyebrow">ORDER MANAGEMENT</p><h2>จัดการคำสั่งซื้อ & เตรียมจัดส่ง</h2></div><div style="max-width:800px;margin:auto"><label>Google Apps Script API URL<input id="api" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin Token<input id="token" placeholder="Token ที่กำหนดใน Apps Script"></label><button class="btn" onclick="loadOrders()">โหลดคำสั่งซื้อ</button><button class="btn" onclick="printPick()">พิมพ์ Pick List (รวม)</button><div id="orders"></div></div></main><script>
let orders=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadOrders(){let url=document.getElementById('api').value.trim(),token=document.getElementById('token').value;if(!url){alert('กรอก API URL');return}try{let r=await fetch(url+'?action=listOrders&token='+encodeURIComponent(token));let d=await r.json();if(!d.ok)throw Error(d.error||'API error');orders=d.orders||[];render()}catch(e){alert('โหลดไม่ได้: '+e.message+' — ตรวจ URL, token และการ Deploy')} }
function render(){document.getElementById('orders').innerHTML=orders.map(o=>`<article class="product-info" style="background:#fff;margin:15px 0;border:1px solid #e4d3c2;border-radius:8px"><h3>${esc(o.orderId)} · ${esc(o.name)}</h3><p>${esc(o.phone)}<br>${esc(o.address)}<br>หมายเหตุ: ${esc(o.note)}</p><p>สถานะ: ${esc(o.status)} · ยอด ${Number(o.total).toLocaleString()} ฿</p><p>${(o.items||[]).map(i=>`${esc(i.sku)} ${esc(i.name)} ×${i.quantity}`).join('<br>')}</p><button class="btn" onclick="printLabel('${esc(o.orderId)}')">พิมพ์จ่าหน้า</button> <button class="btn" onclick="printPacking('${esc(o.orderId)}')">พิมพ์ Packing List</button></article>`).join('')||'<p>ยังไม่มีคำสั่งซื้อ</p>'}
function getOrder(id){return orders.find(o=>o.orderId===id)}function printPick(){let sum={};orders.forEach(o=>(o.items||[]).forEach(i=>sum[i.sku]=(sum[i.sku]||0)+Number(i.quantity)));printDoc('รายการหยิบสินค้า (Pick List)',Object.entries(sum).map(([sku,q])=>`<tr><td>${esc(sku)}</td><td>${q}</td><td>☐</td></tr>`).join(''),'<th>SKU</th><th>จำนวนรวม</th><th>หยิบแล้ว</th>')}
function printPacking(id){let o=getOrder(id);if(!o)return;printDoc('Packing List · '+id,`<tr><td colspan="3">ลูกค้า: ${esc(o.name)}</td></tr>`+(o.items||[]).map(i=>`<tr><td>${esc(i.sku)} · ${esc(i.name)}</td><td>${i.quantity}</td><td>☐</td></tr>`).join('')+`<tr><td>รวม</td><td colspan="2">${Number(o.total).toLocaleString()} ฿</td></tr>`,'<th>สินค้า</th><th>จำนวน</th><th>ตรวจแล้ว</th>')}
function printLabel(id){let o=getOrder(id);if(!o)return;printDoc('Shipping Label · '+id,`<tr><td colspan="3"><h2>${esc(o.name)}</h2><p>โทร. ${esc(o.phone)}</p><p>${esc(o.address)}</p><p>เลขออเดอร์ ${esc(id)}</p><p>หมายเหตุ: ${esc(o.note)}</p></td></tr>`,'')}
function printDoc(title,rows,head){let w=window.open('','_blank');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial,sans-serif;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:10px}h1{margin-bottom:25px}</style></head><body><h1>${title}</h1><table>${head?'<thead><tr>'+head+'</tr></thead>':''}<tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
</script></body></html>
